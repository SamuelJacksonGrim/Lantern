[package]
name = "lantern"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "1", features = ["system-tray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1"
chrono = { version = "0.4" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
lantern-memory = { path = "../../memory" }

[build-dependencies]
tauri-build = { version = "1", features = [] }
